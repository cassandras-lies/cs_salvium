name: cs_salvium_flutter_libs
description: "Binaries required to use cs_salvium in a Flutter project"
version: 1.0.0
repository: https://github.com/cypherstack/cs_salvium
homepage: https://github.com/cypherstack/cs_salvium
issue_tracker: https://github.com/cypherstack/cs_salvium/issues

environment:
  sdk: ">=3.5.3 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cs_salvium_flutter_libs_platform_interface:
    path: ../cs_salvium_flutter_libs_platform_interface
  cs_salvium_flutter_libs_android:
    path: ../cs_salvium_flutter_libs_android
  cs_salvium_flutter_libs_ios:
    path: ../cs_salvium_flutter_libs_ios
  cs_salvium_flutter_libs_linux:
    path: ../cs_salvium_flutter_libs_linux
  cs_salvium_flutter_libs_macos:
    path: ../cs_salvium_flutter_libs_macos
  cs_salvium_flutter_libs_windows:
    path: ../cs_salvium_flutter_libs_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: cs_salvium_flutter_libs_android
      ios:
        default_package: cs_salvium_flutter_libs_ios
      linux:
        default_package: cs_salvium_flutter_libs_linux
      macos:
        default_package: cs_salvium_flutter_libs_macos
      windows:
        default_package: cs_salvium_flutter_libs_windows
